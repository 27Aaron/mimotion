name: Build MiMotion Docker image
description: Build the multi-architecture image, optionally pushing it to GHCR.
inputs:
  push:
    description: Push the image to GHCR
    required: false
    default: "false"
  image_tag:
    description: Version tag used by a manual build
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - uses: docker/login-action@v4
      if: ${{ inputs.push == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern=v{{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          type=raw,value=v${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          type=raw,value=latest,enable=${{ inputs.push == 'true' && inputs.image_tag != '' }}

    - uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push == 'true' }}
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=mimotion
        cache-to: type=gha,mode=max,scope=mimotion,ignore-error=true
