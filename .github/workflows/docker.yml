name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "镜像版本 tag（如 3.0.0，将同时产出 v 前缀和 latest）"
        required: true
        type: string
      push:
        description: "是否推送镜像到 GHCR；关闭时只构建验证"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check source
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  build:
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.push != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-build
        with:
          image_tag: ${{ inputs.image_tag }}
          push: "false"

  publish:
    needs: checks
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-build
        with:
          image_tag: ${{ inputs.image_tag }}
          push: "true"
