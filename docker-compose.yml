services:
  mimotion:
    build: .
    container_name: mimotion
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Linux 主机首次使用需保证容器用户（uid 10001）可写：
      #   mkdir -p data && sudo chown 10001:10001 data
      # macOS（Docker Desktop / OrbStack）无需处理。
      - ./data:/var/lib/mimotion
    environment:
      - DATABASE_URL=/var/lib/mimotion/mimotion.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
